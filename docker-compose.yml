services:
  projector-db:
    image: postgres:16-alpine
    container_name: konductor-projector-db
    environment:
      POSTGRES_DB: konductor
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - projector-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d konductor"]
      interval: 10s
      timeout: 5s
      retries: 5

  projector-db-viewer:
    image: dpage/pgadmin4:8
    container_name: konductor-projector-db-viewer
    depends_on:
      projector-db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@konductor.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - projector-pgadmin-data:/var/lib/pgadmin

  kafka:
    image: apache/kafka:3.7.0
    container_name: konductor-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: konductor-local-kafka-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - kafka-data:/bitnami/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: konductor-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: konductor-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  producer:
    build:
      context: ./producer
    container_name: konductor-producer
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KONDUCTOR_SOURCE_EVENTS_TOPIC: konductor.source-events

  projector:
    build:
      context: ./projector
    container_name: konductor-projector
    depends_on:
      projector-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://projector-db:5432/konductor
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KONDUCTOR_SOURCE_EVENTS_TOPIC: konductor.source-events
      KONDUCTOR_CONSUMER_ACKS_TOPIC: konductor.consumer-acks
      KONDUCTOR_SUBSCRIPTION_TOPIC_PREFIX: konductor.subscription

  consumer:
    build:
      context: ./consumer
    container_name: konductor-consumer
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KONDUCTOR_CONSUMER_GROUP_ID: konductor-consumer
      KONDUCTOR_CONSUMER_NAME: sample-consumer
      KONDUCTOR_SUBSCRIPTION_TOPIC: konductor.subscription.sub_local
      KONDUCTOR_CONSUMER_ACKS_TOPIC: konductor.consumer-acks

volumes:
  projector-db-data:
  projector-pgadmin-data:
  kafka-data:
